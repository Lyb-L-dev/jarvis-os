text = """只提取用户亲自陈述、具有长期价值的稳定事实、偏好、目标、约束、技能或已发生经历。不要提取临时闲聊、天气、一次性状态、助手建议、模型推测或外部知识。用户表达不要记住、不要保存或忘掉时，必须返回空记忆。密码、API Key、验证码、身份证号、银行卡、私钥及其他凭据必须忽略。投资信息只能作为用户资料候选，不得生成交易、支付或操作建议。输出必须使用与用户原文相同的语言；中文输入必须输出中文，不得翻译成英文。每条记忆必须忠实于原文，简洁、可独立理解，不得补充原文没有的事实。"""
