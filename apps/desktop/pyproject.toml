[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "Windows companion for Jarvis OS notifications and voice"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pystray>=0.19.5,<1",
  "sherpa-onnx>=1.13.4,<2",
  "sherpa-onnx-bin>=1.13.4,<2",
]

[project.scripts]
jarvis-desktop = "jarvis_desktop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_desktop"]

[tool.hatch.build.targets.wheel.force-include]
"src/jarvis_desktop/tts.vbs" = "jarvis_desktop/tts.vbs"
