name: ci

on:
  push:
    branches: [dev, "feat/**"]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    name: Backend (ruff + pytest + security)
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      PYTHONUTF8: "1"
      PIP_CACHE_DIR: "${{ github.workspace }}/.cache/pip"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-${{ hashFiles('apps/api/pyproject.toml') }}

      - name: Install API package (dev extras)
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Ruff check
        working-directory: apps/api
        run: ruff check .

      - name: Pytest (backend)
        working-directory: apps/api
        run: pytest --basetemp "$RUNNER_TEMP/pytest" -o "cache_dir=$RUNNER_TEMP/pytest-cache"

      - name: Security check
        working-directory: apps/api
        run: pip-audit --vulnerability-service osv

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  desktop-windows:
    name: Desktop (Windows contracts + Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop-shell
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-shell/package-lock.json

      - name: Install desktop toolchain
        run: npm ci

      - name: Desktop contract tests
        run: npm run check

      - name: Desktop dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Create signed update fixture
        shell: pwsh
        run: |
          ./scripts/new-update-signing-key.ps1 -OutputDirectory "${{ runner.temp }}/jarvis-update-key"
          ./scripts/generate-update-envelope.ps1 `
            -InstallerPath "$env:SystemRoot/System32/notepad.exe" `
            -Channel beta `
            -PackageUrl "https://github.com/Lyb-L-dev/jarvis-os/releases/download/ci/notepad.exe" `
            -SigningKeyPath "${{ runner.temp }}/jarvis-update-key/private-key.dpapi.json" `
            -OutputPath "${{ runner.temp }}/jarvis-update-envelope.json"

      - name: Rust tests with signed fixture
        shell: pwsh
        env:
          JARVIS_UPDATE_PUBLIC_KEY_FILE: ${{ runner.temp }}/jarvis-update-key/public-key.json
          JARVIS_UPDATE_TEST_ENVELOPE: ${{ runner.temp }}/jarvis-update-envelope.json
        run: ./scripts/native.ps1 test

  deploy-rules:
    name: Docker rules (compose + ingress syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate n8n ingress JS syntax
        run: node --check infra/n8n/ingress/server.js

      - name: Validate browser worker JS syntax
        run: node --check apps/browser-worker/server.cjs
